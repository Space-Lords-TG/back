name: CI CD DEV

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:  # Добавляем ручной триггер
  push:
    branches:
      - dev
      - hotfix

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY_DEV }}
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_DEV }}

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: space-lords-dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install flake8 black

      - name: Run Black (check formatting)
        run: black .

      - name: Run flake8
        run: flake8 . --count --show-source --statistics

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    environment: space-lords-dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push Docker image
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671

        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          build-args: |
            BOT_TOKEN=${{ secrets.BOT_TOKEN_DEV }}
            DB_USERNAME=${{ secrets.DB_USERNAME_DEV }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD_DEV }}
            DB_IP=${{ secrets.DB_IP_DEV }}
            DB_PORT=${{ secrets.DB_PORT_DEV }}
            DB_NAME=${{ secrets.DB_NAME_DEV }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
  
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: space-lords-dev
    steps:
      - name: multiple command
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: | 
            cd app
            docker-compose stop backend-test
            docker system prune -f
            docker-compose pull backend-test
            docker-compose up -d backend-test
            sleep 5
            docker-compose ps backend-test
            docker-compose logs -t --tail="50" backend-test
